# Mail Manager — tunnel Cloudflare (HTTPS su mail.colorsdev.tech).
# Serve static web + proxy /api → mail-manager:8000

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    upstream mail_manager_api {
        server mail-manager:8000;
    }

    server {
        listen 80;
        server_name mail.colorsdev.tech _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://mail_manager_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
