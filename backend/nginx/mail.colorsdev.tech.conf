# Mail Manager — UI statica + API
# Incluso da edge nginx (colorsdev-site): /root/nginx-apps/
# Web: /root/sites/mail-manager (symlink a /root/mail-manager/web)
#
# Una tantum:
#   1) GoDaddy: A record mail.colorsdev.tech → IP VPS
#   2) certbot certonly --webroot -w /var/www/certbot -d mail.colorsdev.tech
#   3) conf in /root/nginx-apps/ + symlink in /root/sites/ + reload nginx

server {
    listen 80;
    server_name mail.colorsdev.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.colorsdev.tech;

    client_max_body_size 40m;

    ssl_certificate     /etc/letsencrypt/live/mail.colorsdev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.colorsdev.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }

        proxy_pass http://mail-manager:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 40m;
    }

    location = /sw.js {
        root /var/www/root/mail-manager/web;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        default_type application/javascript;
    }

    location = /manifest.webmanifest {
        root /var/www/root/mail-manager/web;
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/manifest+json;
    }

    location / {
        root /var/www/root/mail-manager/web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }
}
